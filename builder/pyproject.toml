[project]
name = "gads-builder"
version = "0.1.0"
description = "Local, approval-gated Google Ads campaign builder (MCP server)"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12,<5",
  "google-ads>=34,<35",
  "pillow>=10",
]

[project.scripts]
gads-builder = "gads_builder.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gads_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: reads the real account / check-only mode; needs GADS_LIVE=1, VPN, and no command sandbox",
]
